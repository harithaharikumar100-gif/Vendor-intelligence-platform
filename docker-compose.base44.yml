services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn server:app --reload --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  frontend:
    image: node:20-slim
    working_dir: /app/frontend
    volumes:
      - ./:/app
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - VITE_API_PROXY_TARGET=http://backend:8000
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
